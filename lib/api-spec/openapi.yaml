openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Shared SILA ME foundation API for Cloud and Mobile
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Application-scoped authentication
  - name: account
    description: Authenticated account operations
  - name: access
    description: Organization and user access foundation
  - name: operations
    description: Invoice receiving and inventory operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/cloud/login:
    post:
      operationId: cloudLogin
      tags: [auth]
      summary: Start a Cloud session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated Cloud account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /auth/cloud/session:
    get:
      operationId: getCloudSession
      tags: [auth]
      summary: Restore a Cloud session
      responses:
        "200":
          description: Authenticated Cloud account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /auth/cloud/logout:
    post:
      operationId: cloudLogout
      tags: [auth]
      summary: Revoke the current Cloud session
      responses:
        "204":
          description: Session revoked
  /auth/mobile/login:
    post:
      operationId: mobileLogin
      tags: [auth]
      summary: Start a Mobile session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated Mobile account and bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileAuthSession"
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /auth/mobile/logout:
    post:
      operationId: mobileLogout
      tags: [auth]
      summary: Revoke the current Mobile session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked
  /me:
    get:
      operationId: getCurrentUser
      tags: [account]
      summary: Get the authenticated user
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Authenticated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /v1/access/context:
    get:
      operationId: getAccessContext
      tags: [access]
      summary: Get the current organization and permission context
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Current access context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessContext"
        "401":
          $ref: "#/components/responses/AuthenticationError"
  /v1/access/users:
    get:
      operationId: getAccessUsers
      tags: [access]
      summary: List users in accessible organizations
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Accessible users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessUser"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          description: Missing Cloud access permission
    post:
      operationId: createAccessUser
      tags: [access]
      summary: Create a user with scoped access
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccessUserInput"
      responses:
        "201":
          description: User created
        "403":
          description: Missing user permission
  /v1/access/users/{userId}:
    get:
      operationId: getAccessUser
      tags: [access]
      summary: Get a user access detail and effective authorization preview
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: User access detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessUserDetail"
        "404":
          description: User is outside the current tenant scope
  /v1/access/users/{userId}/overrides:
    put:
      operationId: setUserAuthorizationOverride
      tags: [access]
      summary: Set a user-level grant or deny override
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationOverrideInput"
      responses:
        "200":
          description: Updated user detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessUserDetail"
  /v1/access/users/{userId}/overrides/{authorizationId}:
    delete:
      operationId: removeUserAuthorizationOverride
      tags: [access]
      summary: Remove a user-level authorization override
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: authorizationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Override removed
  /v1/access/authorization-preview:
    get:
      operationId: getAuthorizationPreview
      tags: [access]
      summary: Preview permissions inherited from a role
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: roleId
          schema: { type: string, format: uuid }
        - in: query
          name: application
          schema: { type: string, enum: [CLOUD, MOBILE] }
      responses:
        "200":
          description: Authorization preview
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthorizationPreview"
  /v1/access/storage-connections:
    get:
      operationId: getStorageConnections
      tags: [access]
      summary: List organization storage connections
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: organizationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Storage connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorageConnection"
    post:
      operationId: createStorageConnection
      tags: [access]
      summary: Register an external storage connection for backend validation
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStorageConnectionInput"
      responses:
        "201":
          description: Pending storage connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageConnection"
  /v1/access/roles:
    get:
      operationId: getAccessRoles
      tags: [access]
      summary: List active roles and permissions
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Active roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          description: Missing Cloud access permission
    post:
      operationId: assignRole
      tags: [access]
      summary: Assign a role to a user
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleInput"
      responses:
        "204":
          description: Role assigned
        "403":
          description: Missing access permission
  /v1/access/permissions:
    get:
      operationId: getAccessPermissions
      tags: [access]
      summary: List active permissions
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Active permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "403":
          description: Missing Cloud access permission
  /v1/access/organizations:
    post:
      operationId: createOrganization
      tags: [access]
      summary: Create an organization
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationInput"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "403":
          description: Missing organization permission
  /v1/access/organizations/{organizationId}/logo:
    get:
      operationId: getOrganizationLogo
      tags: [access]
      summary: Download the customer logo for an organization
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Customer logo image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        "404":
          description: No customer logo configured
    put:
      operationId: uploadOrganizationLogo
      tags: [access]
      summary: Upload or replace the customer logo (SUPER_ADMIN only)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Organization with updated logo URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "403":
          description: Only SUPER_ADMIN can update the customer logo
    delete:
      operationId: deleteOrganizationLogo
      tags: [access]
      summary: Remove the customer logo (SUPER_ADMIN only)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization with logo cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "403":
          description: Only SUPER_ADMIN can remove the customer logo
  /v1/access/organizations/{organizationId}/units:
    post:
      operationId: createOrganizationUnit
      tags: [access]
      summary: Create an operating unit
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationUnitInput"
      responses:
        "201":
          description: Operating unit created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationUnit"
        "403":
          description: Missing organization permission
  /v1/access/memberships:
    post:
      operationId: assignMembership
      tags: [access]
      summary: Assign a user to an organization scope
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignMembershipInput"
      responses:
        "204":
          description: Membership assigned
        "403":
          description: Missing access permission
  /v1/documents/invoices:
    post:
      operationId: uploadInvoiceDocument
      tags: [operations]
      summary: Upload and process an invoice document
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadInvoiceDocumentInput"
      responses:
        "200":
          description: Processed invoice document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/OperationalError"
  /v1/documents/basic-extract:
    post:
      operationId: extractBasicInvoice
      tags: [operations]
      summary: Extract the seven basic invoice fields from a temporary document
      description: Authenticated backend OCR fallback for Mobile review. This endpoint does not create a persistent document or invoice.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BasicOcrInput"
      responses:
        "200":
          description: Basic OCR result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicOcrResponse"
        "400":
          $ref: "#/components/responses/OperationalError"
  /v1/invoices/advanced-extract:
    post:
      operationId: extractAdvancedInvoice
      tags: [operations]
      summary: Run organization-controlled advanced invoice extraction on a temporary document
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AdvancedInvoiceExtractionInput"
      responses:
        "200":
          description: Advanced extraction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvancedInvoiceExtractionResponse"
        "400":
          $ref: "#/components/responses/OperationalError"
  /v1/documents/{id}:
    get:
      operationId: getDocument
      tags: [operations]
      summary: Get an invoice document
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
  /v1/documents/{id}/content:
    get:
      operationId: getDocumentContent
      tags: [operations]
      summary: Stream the stored invoice document
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Original stored document bytes
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /v1/documents/{id}/advanced-extract:
    post:
      operationId: extractAdvancedDocument
      tags: [operations]
      summary: Run advanced extraction against the authoritative stored document
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Advanced extraction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvancedInvoiceExtractionResponse"
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
  /v1/documents/{id}/status:
    get:
      operationId: getDocumentStatus
      tags: [operations]
      summary: Get document processing status
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Processing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentStatus"
  /v1/invoices:
    get:
      operationId: getInvoices
      tags: [operations]
      summary: List accessible invoices
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
  /v1/invoices/{id}:
    get:
      operationId: getInvoice
      tags: [operations]
      summary: Get an invoice
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    put:
      operationId: updateInvoice
      tags: [operations]
      summary: Correct invoice fields
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvoiceInput"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /v1/invoices/{id}/process:
    post:
      operationId: processInvoice
      tags: [operations]
      summary: Process an uploaded invoice
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: Processed invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /v1/invoices/{id}/basic-extraction:
    get:
      operationId: getInvoiceBasicExtraction
      tags: [operations]
      summary: Get the lightweight extraction result for Mobile
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: Basic invoice extraction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicInvoiceExtraction"
  /v1/invoices/{id}/extraction:
    get:
      operationId: getInvoiceExtraction
      tags: [operations]
      summary: Get the full invoice extraction result
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: Full invoice extraction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceExtraction"
  /v1/invoices/{id}/reprocess:
    post:
      operationId: reprocessInvoice
      tags: [operations]
      summary: Re-run invoice extraction
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: Reprocessed extraction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceExtraction"
  /v1/invoices/{id}/advanced-reread:
    post:
      operationId: advancedReread
      tags: [operations]
      summary: Re-read the authoritative invoice PDF with backend advanced OCR
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: Advanced extraction result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvancedInvoiceExtractionResponse"
  /v1/invoices/{id}/extraction-history:
    get:
      operationId: getInvoiceExtractionHistory
      tags: [operations]
      summary: List immutable extraction runs for an invoice
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: Extraction history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExtractionHistoryItem"
  /v1/configuration/invoice-ocr:
    get:
      operationId: getInvoiceOcrConfiguration
      tags: [configuration]
      summary: Get organization-scoped invoice OCR configuration
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: organizationId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Invoice OCR configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceOcrConfiguration"
    put:
      operationId: updateInvoiceOcrConfiguration
      tags: [configuration]
      summary: Update organization-scoped invoice OCR configuration
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: organizationId
          in: query
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceOcrConfigurationInput"
      responses:
        "200":
          description: Updated invoice OCR configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceOcrConfiguration"
  /v1/extraction-agents:
    get:
      operationId: getExtractionAgents
      tags: [operations]
      summary: List invoice extraction provider configurations
      security:
        - cookieAuth: []
      parameters:
        - name: organizationId
          in: query
          schema: { type: string, nullable: true }
      responses:
        "200":
          description: Extraction provider configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExtractionAgentConfig"
    post:
      operationId: createExtractionAgent
      tags: [operations]
      summary: Create an invoice extraction provider configuration
      security:
        - cookieAuth: []
      parameters:
        - name: organizationId
          in: query
          schema: { type: string, nullable: true }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertExtractionAgentConfigInput"
      responses:
        "200":
          description: Created provider configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionAgentConfig"
  /v1/extraction-agents/{id}:
    put:
      operationId: updateExtractionAgent
      tags: [operations]
      summary: Update an invoice extraction provider configuration
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertExtractionAgentConfigInput"
      responses:
        "200":
          description: Updated provider configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionAgentConfig"
  /v1/extraction-agents/{id}/test:
    post:
      operationId: testExtractionAgent
      tags: [operations]
      summary: Validate an invoice extraction provider configuration
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Safe connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionAgentTest"
  /v1/invoices/{id}/match-supplier:
    post:
      operationId: matchInvoiceSupplier
      tags: [operations]
      summary: Match an invoice to a supplier
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchSupplierInput"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
  /v1/invoices/{id}/supplier-candidates:
    get:
      operationId: getInvoiceSupplierCandidates
      tags: [operations]
      summary: Get authoritative supplier candidates for an invoice
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      responses:
        "200":
          description: Supplier candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierMatchResponse"
  /v1/invoices/{id}/match-po:
    post:
      operationId: matchInvoicePurchaseOrder
      tags: [operations]
      summary: Match an invoice to a purchase order
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchPurchaseOrderInput"
