components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
    DocumentId:
      name: id
      in: path
      required: true
      schema: { type: string }
    InvoiceId:
      name: id
      in: path
      required: true
      schema: { type: string }
    GrnId:
      name: id
      in: path
      required: true
      schema: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: sila_me_session
  responses:
    AuthenticationError:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    OperationalError:
      description: Operational request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    IntegrationConfigurationInput:
      type: object
      properties:
        name: { type: string }
        entityCode: { type: string }
        organizationUnitId: { type: string, format: uuid, nullable: true }
        processType: { type: string, enum: [GET_PO, GET_SUPPLIER, POST_PO, GET_GRN, POST_GRN, GET_INVOICE, POST_INVOICE, GET_STOCK] }
        protocol: { type: string, enum: [REST, ODATA_V4] }
        baseUrl: { type: string, format: uri }
        resourcePath: { type: string, nullable: true }
        authenticationType: { type: string, enum: [NONE, BASIC, BEARER_TOKEN, OAUTH2_CLIENT_CREDENTIALS, CUSTOM_TOKEN_ENDPOINT] }
        username: { type: string, nullable: true }
        password: { type: string, nullable: true, writeOnly: true }
        clientId: { type: string, nullable: true, writeOnly: true }
        clientSecret: { type: string, nullable: true, writeOnly: true }
        bearerToken: { type: string, nullable: true, writeOnly: true }
        tokenEndpoint: { type: string, nullable: true }
        tokenScope: { type: string, nullable: true }
        tokenHeaders: { type: object, additionalProperties: { type: string }, nullable: true }
        tokenBody: { type: object, additionalProperties: { type: string }, nullable: true }
        timeoutSeconds: { type: integer, minimum: 5, maximum: 300 }
        retryCount: { type: integer, minimum: 0, maximum: 5 }
        pageSize: { type: integer, minimum: 1, maximum: 1000, nullable: true }
        watermarkField: { type: string, nullable: true }
        scheduleCron: { type: string, nullable: true }
      required: [name, entityCode, processType, protocol, baseUrl, authenticationType]
    IntegrationConfiguration:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        organizationUnitId: { type: string, format: uuid, nullable: true }
        entityCode: { type: string }
        name: { type: string }
        processType: { type: string }
        protocol: { type: string }
        baseUrl: { type: string }
        resourcePath: { type: string, nullable: true }
        authenticationType: { type: string }
        username: { type: string, nullable: true }
        credentialStatus: { type: string }
        timeoutSeconds: { type: integer }
        retryCount: { type: integer }
        pageSize: { type: integer, nullable: true }
        watermarkField: { type: string, nullable: true }
        lastWatermark: { type: string, format: date-time, nullable: true }
        lastAttemptAt: { type: string, format: date-time, nullable: true }
        lastSuccessfulRunAt: { type: string, format: date-time, nullable: true }
        nextRunAt: { type: string, format: date-time, nullable: true }
        isRunning: { type: boolean }
        lastErrorSafe: { type: string, nullable: true }
        scheduleCron: { type: string, nullable: true }
